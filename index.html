<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#1a2417" media="(prefers-color-scheme:dark)"><meta name="description" content="Cardápio digital do Restaurante Denada — cozinha italiana e baiana na Pousada Denada, Barra Grande, Maraú – BA."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Denada"><meta property="og:title" content="Restaurante Denada — Cardápio"><meta property="og:description" content="Cardápio digital do Restaurante Denada — cozinha italiana e baiana na Pousada Denada, Barra Grande, Maraú – BA."><meta property="og:type" content="website"><meta property="og:locale" content="pt_BR"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f6b27'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='%23fffdf8' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E"><title>Restaurante Denada — Cardápio</title>
<style>
:root{--bg:#f6f4ea;--card:#fffdf8;--ink:#23291f;--mut:#667060;--g:#3f6b27;--gt:#fff;--br:#7a5e40;--line:#e4e2d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a12;--card:#1a2417;--ink:#eef2e8;--mut:#a9b8a1;--g:#8cc063;--gt:#10170d;--br:#c2a47c;--line:#2d3b28}}
:root[data-theme="dark"]{--bg:#141a12;--card:#1a2417;--ink:#eef2e8;--mut:#a9b8a1;--g:#8cc063;--gt:#10170d;--br:#c2a47c;--line:#2d3b28}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bh,116px) + 8px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif}
header{position:relative;background:var(--card);border-top:4px solid var(--g);border-bottom:1px solid var(--line);padding:22px 16px 18px;text-align:center}
.logo{margin:0 auto;width:min(138px,44vw);aspect-ratio:520/324;background:var(--br);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
header p{margin:12px 0 0;font:11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 0}
input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font:16px system-ui,sans-serif;background:var(--card);color:var(--ink)}
nav{position:relative;display:flex;gap:8px;overflow-x:auto;padding:10px 28px 10px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:0 14px;min-height:44px;display:flex;align-items:center;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:14px system-ui,sans-serif;text-decoration:none}
nav a.on{background:var(--g);border-color:var(--g);color:var(--gt)}
a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.demo{color:var(--mut);font:12px/1.4 system-ui,sans-serif;text-align:center;padding:2px 8px}
section{margin-top:34px;content-visibility:auto;contain-intrinsic-size:auto 420px}
h2{margin:0;font-size:22px;font-weight:400;color:var(--g);letter-spacing:.01em}
h2::after{content:"";display:block;width:36px;height:2px;background:var(--br);margin-top:8px}
h2 i{display:block;margin-top:1px;font-size:13px;color:var(--mut)}
.note{font:13px/1.4 system-ui,sans-serif;color:var(--mut);margin:10px 0 0}
.it{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
section .it:first-of-type{margin-top:6px}
.it>div:first-child{min-width:0}
.it b{font-weight:600;font-size:16px}.it em{display:block;color:var(--mut);font-size:14px;line-height:1.3}
.it small{display:block;color:var(--mut);font:13px/1.35 system-ui,sans-serif;margin-top:3px}
.pr{flex:none;font:600 16px system-ui,sans-serif;color:var(--g);text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
#empty{display:none;text-align:center;color:var(--mut);padding:40px 0;font-family:system-ui,sans-serif}
footer{background:var(--card);border-top:1px solid var(--line);text-align:center;color:var(--mut);font:13px/1.7 system-ui,sans-serif;padding:26px 16px 36px}
footer b{color:var(--ink);font:600 15px Georgia,serif}footer a{color:var(--g)}
.fl{display:flex;gap:18px;justify-content:center;margin:10px 0 14px}.fl a{font-weight:600;min-height:32px;display:flex;align-items:center}
footer small{display:block;font-size:11px}
#top{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:var(--gt);font:20px system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#top.show{opacity:1;pointer-events:auto}
.lg{position:absolute;top:12px;right:12px;display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.lg button{border:0;background:none;color:var(--mut);font:600 12px system-ui,sans-serif;min-width:44px;height:44px;cursor:pointer}.lg button[aria-pressed="true"]{background:var(--g);color:var(--gt)}
.tm{position:absolute;top:12px;left:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.tm svg{width:18px;height:18px}.tm .sun{display:none}:root[data-theme="dark"] .tm .sun{display:block}:root[data-theme="dark"] .tm .moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tm .sun{display:block}:root:not([data-theme="light"]) .tm .moon{display:none}}
*{-webkit-tap-highlight-color:transparent}a,button,input{touch-action:manipulation}
nav{overscroll-behavior-x:contain}.pr{white-space:nowrap}
nav a:active,.lg button:active,.tm:active,#top:active,.fl a:active{opacity:.65}
.cnt{margin:8px 0 0;font:12px system-ui,sans-serif;color:var(--mut);text-align:center}.cnt:empty{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
